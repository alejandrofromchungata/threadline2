name = "threadline-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-sonnet-5"

# Rate limiting store. Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "055c638b755c472c9aa2e28a84085541"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REMOVEBG_API_KEY
#   npx wrangler secret put SCRAPER_API_KEY   (optional — routes blocked/JS-rendered
#     product pages through scraperapi.com instead of fetching them directly)
